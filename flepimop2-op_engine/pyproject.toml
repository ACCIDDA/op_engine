[project]
name = "flepimop2-op_engine"
version = "0.2.0"
readme = { file = "README.md", content-type = "text/markdown" }
description = "flepimop2 engine provider package for op_engine"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "Joshua Macdonald", email = "jmacdo16@jh.edu" },
  { name = "Carl Pearson", email = "cap1024@unc.edu" },
  { name = "Timothy Willard", email = "twillard@unc.edu" },
]
keywords = ["flepimop2", "op_engine", "engine", "provider"]
dependencies = [
  "op-engine==0.2.0",
  "flepimop2>=0.3.0",
  "pydantic>=2.0,<3",
  "numpy>=2.0",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.optional-dependencies]
op-system = [
  "flepimop2-op-system>=0.4.0",
]
jax = [
  "jax>=0.4.32; python_version < '3.13'",
  "jax>=0.4.36; python_version == '3.13'",
  "jax>=0.7.1; python_version >= '3.14'",
]

[project.urls]
Repository = "https://github.com/ACCIDDA/op_engine"
Documentation = "https://accidda.github.io/op_engine/"
Issues = "https://github.com/ACCIDDA/op_engine/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ensure hatchling can build from src/ layout and include the namespace package
[tool.hatch.build.targets.wheel]
packages = ["src/flepimop2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.uv.sources]
op-engine = { path = "..", editable = true }
# Reproducible development pins for the op_system 0.4 provider contract.
# Published wheel metadata continues to use the registry requirements above.
flepimop2-op-system = { git = "https://github.com/ACCIDDA/op_system", rev = "a57071736532744d431c372e1af1f56665f88f0b", subdirectory = "flepimop2-op_system" }
op-system = { git = "https://github.com/ACCIDDA/op_system", rev = "a57071736532744d431c372e1af1f56665f88f0b" }


[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D212",
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["INP001", "S101"]
"src/flepimop2/engine/op_engine/__init__.py" = ["C901", "DOC201", "DOC501", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "RUF067"]
"src/flepimop2/engine/op_engine/operators.py" = ["C901", "DOC201", "DOC501"]
"src/flepimop2/engine/op_engine/reactions.py" = ["C901", "DOC501", "PLR0912", "PLR0914", "PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
  "flepimop2-op-system>=0.4.0",
  "op-system>=0.4.0",
  "jax>=0.4.32; python_version < '3.13'",
  "jax>=0.4.36; python_version == '3.13'",
  "jax>=0.7.1; python_version >= '3.14'",
  "pytest>=8.4.2",
  "ruff>=0.13.3,<0.15",
  "mypy>=1.18.2",
]
