---
name: 'CI'

'on':
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'

jobs:
  backend:
    name: 'Solver qualification (${{ matrix.backend }}, 3.12)'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        backend: ['numpy', 'jax', 'torch']
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '3.12'
      - name: 'Install qualification dependencies'
        run: 'uv sync --dev'
      - name: 'Install required CPU Torch'
        if: "matrix.backend == 'torch'"
        run: "uv pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu"
      - name: 'Run selected backend without skipped qualification'
        run: 'uv run --no-sync python scripts/qualify_backend.py ${{ matrix.backend }}'
  build-check:
    name: 'Build Check (${{ matrix.python-version }})'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.12'
    steps:
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv with python ${{ matrix.python-version }}'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'Run Build Check'
        run: 'just build-check'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
  ci:
    name: 'CI (${{ matrix.python-version }})'
    needs:
      - 'docs'
      - 'build-check'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv with python ${{ matrix.python-version }}'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'Run Checks'
        run: 'just ci'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
  docs:
    name: 'Docs (${{ matrix.python-version }})'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.12'
    steps:
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'Build Documentation'
        run: 'just docs'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
