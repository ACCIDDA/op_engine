---
name: 'CI'

'on':
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'

jobs:
  independent-block-schedules:
    name: 'Independent block schedules (${{ matrix.contract }}, CPU, 3.12)'
    runs-on: 'ubuntu-latest'
    env:
      JAX_PLATFORMS: 'cpu'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    strategy:
      matrix:
        include:
          - contract: 'current'
            jax: '0.12.0.1'
            numpy: '2.5.4'
            scipy: '1.18.1'
            compat: '1.15.0'
          - contract: 'minimum'
            jax: '0.4.38'
            numpy: '2.2.6'
            scipy: '1.13.1'
            compat: '1.12.0'
    defaults:
      run:
        working-directory: 'flepimop2-op_engine'
    steps:
      - uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - name: 'Install the pinned provider and selected CPU numerical contract'
        run: |
          uv sync --dev
          uv pip install 'jax==${{ matrix.jax }}' 'numpy==${{ matrix.numpy }}' 'scipy==${{ matrix.scipy }}' 'array-api-compat==${{ matrix.compat }}'
      - name: 'Require discovery, independent meshes, values, gradients and proof refusal'
        run: |
          .venv/bin/python -m pytest tests/test_independent_block_schedules.py --junitxml=/tmp/block-schedules.xml
          .venv/bin/python -c 'import xml.etree.ElementTree as E; cases=E.parse("/tmp/block-schedules.xml").findall(".//testcase"); assert len(cases)>=34 and not any(c.find("skipped") is not None for c in cases)'
      - name: 'Check common accuracy gates and complete cost accounting'
        run: >-
          .venv/bin/python -m benchmarks.independent_schedules
          --blocks 2 --repeats 1 --output /tmp/independent-block-smoke.jsonl
      - name: 'Retain per-policy measurements and test evidence'
        if: 'always()'
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'independent-block-schedules-${{ matrix.contract }}'
          path: |
            /tmp/independent-block-smoke*
            /tmp/block-schedules.xml
  scipy-minimum:
    name: 'Eager operators oldest compatible SciPy (3.12)'
    runs-on: 'ubuntu-latest'
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - name: 'Install the oldest NumPy 2-compatible SciPy series'
        run: |
          uv venv --python 3.12
          uv pip install -e . pytest 'numpy==2.0.2' 'scipy==1.13.1' 'array-api-compat==1.12.0'
      - name: 'Require original-residual and banded/matrix-free CPU contracts'
        run: 'uv run --no-sync python scripts/qualify_backend.py numpy --linear-operators'
      - name: 'Require JVP-only stages at the NumPy floor'
        run: 'uv run --no-sync python scripts/qualify_backend.py numpy --sdirk-jvp'
      - name: 'Check all eager paths in isolated correctness-gated workers'
        run: >-
          uv run --no-sync python -m scripts.benchmark_linear_operators
          --sizes 8 --rhs 2 --workers-per-case 1 --repeats 1 --require-success
          --output /tmp/eager-operator-smoke.jsonl
      - name: 'Check bounded nonlinear roots with common accuracy gates'
        run: >-
          uv run --no-sync python -m scripts.benchmark_newton_krylov
          --sizes 8 --workers-per-case 1 --repeats 1 --require-success
          --output /tmp/newton-krylov-smoke.jsonl
  diffrax:
    name: 'Compiled Diffrax CPU (${{ matrix.contract }}, 3.12)'
    runs-on: 'ubuntu-latest'
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      JAX_PLATFORMS: 'cpu'
    strategy:
      matrix:
        include:
          - contract: 'current'
            jax: '0.12.0'
            numpy: '2.5.4'
            compat: '1.15.0'
          - contract: 'minimum'
            jax: '0.4.38'
            numpy: '2.0.2'
            compat: '1.12.0'
    steps:
      - uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - name: 'Install explicit CPU numerical contract'
        run: |
          uv venv --python 3.12
          uv pip install -e '.[diffrax]' pytest 'diffrax==0.7.2' 'jax==${{ matrix.jax }}' 'numpy==${{ matrix.numpy }}' 'array-api-compat==${{ matrix.compat }}'
          uv pip install 'op-system @ git+https://github.com/ACCIDDA/op_system.git@bbde00697428f16f6cf948e7aff207f7b65231c8'
      - name: 'Require current compiler values and each claimed transform without skips'
        run: 'uv run --no-sync python scripts/qualify_backend.py jax --diffrax'
      - name: 'Require native operator actions on the selected JAX contract'
        run: 'uv run --no-sync python scripts/qualify_backend.py jax --linear-operators'
      - name: 'Require JVP-only stages and finite-iteration transformations'
        run: 'uv run --no-sync python scripts/qualify_backend.py jax --sdirk-jvp'
      - name: 'Check actual compiled hierarchical fixed/adaptive consumers'
        run: >-
          uv run --no-sync python -m scripts.benchmark_hierarchical
          --groups 1 --local-dimensions 1 --steps 4
          --solvers compiled-diffrax-fixed compiled-diffrax-adaptive
          --derivatives trajectory grad-rev --repeats 1 --timeout 180
          --require-success --output /tmp/compiled-diffrax-smoke.jsonl
  torch-compile:
    name: 'Torch compiled sequential CPU (3.12)'
    runs-on: 'ubuntu-latest'
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TORCHINDUCTOR_COMPILE_THREADS: '1'
    steps:
      - uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - name: 'Install explicit qualified CPU compiler version'
        run: |
          uv venv --python 3.12
          uv pip install -e . pytest
          uv pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
      - name: 'Require actual Inductor values, gradients and failures with zero skips'
        run: >-
          uv run --no-sync python scripts/qualify_backend.py torch --torch-compile
  torch-minimum:
    name: 'Torch minimum state/gradient contract (3.12)'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - name: 'Install minimum supported Torch and array compatibility'
        run: |
          uv venv --python 3.12
          uv pip install -e . pytest 'numpy==2.0.2' 'array-api-compat==1.12.0'
          uv pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - name: 'Require native state and solver gradients'
        run: |
          uv run --no-sync python -c 'import torch; assert torch.__version__.split("+")[0] == "2.6.0"'
          uv run --no-sync pytest tests/op_engine/test_model_core_autograd.py tests/op_engine/test_sensitivities.py tests/op_engine/test_torch_loop.py::test_torch_minimum_version_is_explicitly_rejected -k torch -q
          uv run --no-sync python scripts/qualify_backend.py torch --linear-operators
          uv run --no-sync python scripts/qualify_backend.py torch --sdirk-jvp
  independent-ssa:
    name: 'Independent SSA compiler contract (3.12)'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - run: 'uv sync --dev'
      - run: "uv pip install 'op-system==0.8.0'"
      - name: 'Require real compiler and exact bank execution'
        run: |
          uv run --no-sync python -c 'from op_system import CompiledReaction; assert hasattr(CompiledReaction, "resolved_propensity_fn")'
          uv run --no-sync pytest tests/op_engine/test_batched_ssa.py tests/op_engine/test_replicate_network.py
          uv run --no-sync python -m benchmarks.replicate_ssa --sizes 2 --days 2 --flat-max 2 --output /tmp/replicate-ssa.json
  citation:
    name: 'Citation (3.12)'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - name: 'Validate citation schema and shared metadata'
        run: 'just citation'
  benchmark-smoke:
    name: 'Hierarchical comparison correctness (3.12)'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - name: 'Install optional comparison dependencies explicitly'
        run: 'uv sync --dev --extra benchmark'
      - name: 'Check tiny trajectory and reverse-mode comparisons'
        run: >-
          uv run --no-sync python -m scripts.benchmark_hierarchical
          --groups 1 --local-dimensions 1 --steps 4 --solvers core external
          diffrax-fixed diffrax-adaptive numpy scipy --derivatives trajectory grad-rev
          --repeats 1 --timeout 180 --require-success --output /tmp/hierarchical-smoke.jsonl
      - name: 'Check supported Diffrax higher-order configuration'
        run: >-
          uv run --no-sync python -m scripts.benchmark_hierarchical
          --groups 1 --local-dimensions 1 --steps 4 --solvers diffrax-fixed
          --derivatives hessian logdet-grad --repeats 1 --timeout 180
          --require-success --output /tmp/hierarchical-higher-order.jsonl
      - name: 'Retain correctness/protocol evidence'
        if: 'always()'
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'hierarchical-comparison-correctness'
          path: '/tmp/hierarchical-*.jsonl'
  backend:
    name: 'Solver qualification (${{ matrix.backend }}, 3.12)'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        backend: ['numpy', 'jax', 'torch']
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '3.12'
      - name: 'Install qualification dependencies'
        run: 'uv sync --dev'
      - name: 'Install required CPU Torch'
        if: "matrix.backend == 'torch'"
        run: "uv pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu"
      - name: 'Run selected backend without skipped qualification'
        run: 'uv run --no-sync python scripts/qualify_backend.py ${{ matrix.backend }}'
  compiler-observations:
    name: 'Compiler observations (${{ matrix.backend }}, 3.12)'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        backend: ['numpy', 'jax', 'torch']
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - name: 'Install core development dependencies'
        run: 'uv sync --dev'
      - name: 'Install required CPU Torch'
        if: "matrix.backend == 'torch'"
        run: "uv pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu"
      - name: 'Install immutable merged compiler contract'
        run: >-
          uv pip install
          'op-system @ git+https://github.com/ACCIDDA/op_system.git@ad3c28ac63e9af3b1210413a764b44a9c9bd2074'
      - name: 'Check two-mesh values and native derivatives without selected skips'
        run: >-
          uv run --no-sync python scripts/qualify_backend.py
          ${{ matrix.backend }} --compiler-contract
  build-check:
    name: 'Build Check (${{ matrix.python-version }})'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.12'
    steps:
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv with python ${{ matrix.python-version }}'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'Run Build Check'
        run: 'just build-check'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
  ci:
    name: 'CI (${{ matrix.python-version }})'
    needs:
      - 'docs'
      - 'build-check'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv with python ${{ matrix.python-version }}'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'Run Checks'
        run: 'just ci'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
  docs:
    name: 'Docs (${{ matrix.python-version }})'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.12'
    steps:
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'Build Documentation'
        run: 'just docs'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
