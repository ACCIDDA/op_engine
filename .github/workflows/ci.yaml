---
name: 'CI'

'on':
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'

jobs:
  citation:
    name: 'Citation (3.12)'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - name: 'Validate citation schema and shared metadata'
        run: 'just citation'
  benchmark-smoke:
    name: 'Hierarchical comparison correctness (3.12)'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - name: 'Install optional comparison dependencies explicitly'
        run: 'uv sync --dev --extra benchmark'
      - name: 'Check tiny trajectory and reverse-mode comparisons'
        run: >-
          uv run --no-sync python -m scripts.benchmark_hierarchical
          --groups 1 --local-dimensions 1 --steps 4 --solvers core external
          diffrax-fixed diffrax-adaptive numpy scipy --derivatives trajectory grad-rev
          --repeats 1 --timeout 180 --require-success --output /tmp/hierarchical-smoke.jsonl
      - name: 'Check supported Diffrax higher-order configuration'
        run: >-
          uv run --no-sync python -m scripts.benchmark_hierarchical
          --groups 1 --local-dimensions 1 --steps 4 --solvers diffrax-fixed
          --derivatives hessian logdet-grad --repeats 1 --timeout 180
          --require-success --output /tmp/hierarchical-higher-order.jsonl
      - name: 'Retain correctness/protocol evidence'
        if: 'always()'
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'hierarchical-comparison-correctness'
          path: '/tmp/hierarchical-*.jsonl'
  backend:
    name: 'Solver qualification (${{ matrix.backend }}, 3.12)'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        backend: ['numpy', 'jax', 'torch']
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '3.12'
      - name: 'Install qualification dependencies'
        run: 'uv sync --dev'
      - name: 'Install required CPU Torch'
        if: "matrix.backend == 'torch'"
        run: "uv pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu"
      - name: 'Run selected backend without skipped qualification'
        run: 'uv run --no-sync python scripts/qualify_backend.py ${{ matrix.backend }}'
  compiler-observations:
    name: 'Compiler observations (${{ matrix.backend }}, 3.12)'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        backend: ['numpy', 'jax', 'torch']
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          python-version: '3.12'
      - name: 'Install core development dependencies'
        run: 'uv sync --dev'
      - name: 'Install required CPU Torch'
        if: "matrix.backend == 'torch'"
        run: "uv pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu"
      - name: 'Install immutable merged compiler contract'
        run: >-
          uv pip install
          'op-system @ git+https://github.com/ACCIDDA/op_system.git@0becde52474b48fef6b6f3c42a344498a17552a8'
      - name: 'Check two-mesh values and native derivatives without selected skips'
        run: >-
          uv run --no-sync python scripts/qualify_backend.py
          ${{ matrix.backend }} --compiler-contract
  build-check:
    name: 'Build Check (${{ matrix.python-version }})'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.12'
    steps:
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv with python ${{ matrix.python-version }}'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'Run Build Check'
        run: 'just build-check'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
  ci:
    name: 'CI (${{ matrix.python-version }})'
    needs:
      - 'docs'
      - 'build-check'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv with python ${{ matrix.python-version }}'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'Run Checks'
        run: 'just ci'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
  docs:
    name: 'Docs (${{ matrix.python-version }})'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.12'
    steps:
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          persist-credentials: false
      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'Build Documentation'
        run: 'just docs'
        env:
          UV_PYTHON_VERSION: '${{ matrix.python-version }}'
