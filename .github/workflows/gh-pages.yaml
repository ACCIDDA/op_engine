---
name: 'GitHub Pages Documentation'

'on':
  push:
    branches:
      - 'main'
  workflow_call:
    inputs:
      deploy-mode:
        description: 'Deployment mode used to determine docs aliases'
        required: false
        default: 'push'
        type: 'string'
      release-ref:
        description: 'Exact v-prefixed tag to deploy in release mode'
        required: false
        default: ''
        type: 'string'
  workflow_dispatch:
    inputs:
      deploy-mode:
        description: 'Deployment mode used to determine docs aliases'
        required: false
        default: 'push'
        type: 'choice'
        options:
          - 'push'
          - 'release'
      release-ref:
        description: 'Exact v-prefixed tag to deploy in release mode'
        required: false
        default: ''
        type: 'string'

concurrency:
  group: 'op-engine-pages'
  cancel-in-progress: false

permissions:
  contents: 'read'

jobs:
  deploy:
    name: 'Deploy Documentation to GitHub Pages'
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        python-version:
          - '3.12'
    permissions:
      contents: 'write'  # Needed to push to gh-pages
    steps:
      - name: 'Resolve deployment inputs'
        id: deployment
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = 'workflow_call' ]; then
            MODE="${CALL_MODE}"
            RELEASE_REF="${CALL_RELEASE_REF}"
          elif [ "${EVENT_NAME}" = 'workflow_dispatch' ]; then
            MODE="${DISPATCH_MODE:-push}"
            RELEASE_REF="${DISPATCH_RELEASE_REF}"
          else
            MODE='push'
            RELEASE_REF=''
          fi
          CHECKOUT_REF="${EVENT_SHA}"
          if [ "${MODE}" = 'release' ]; then
            if [ -z "${RELEASE_REF}" ]; then
              echo 'Release mode requires an exact v-prefixed release-ref.' >&2
              exit 1
            fi
            CHECKOUT_REF="${RELEASE_REF}"
          fi
          echo "deploy-mode=${MODE}" >> "${GITHUB_OUTPUT}"
          echo "checkout-ref=${CHECKOUT_REF}" >> "${GITHUB_OUTPUT}"
        env:
          CALL_MODE: '${{ inputs.deploy-mode }}'
          CALL_RELEASE_REF: '${{ inputs.release-ref }}'
          DISPATCH_MODE: '${{ github.event.inputs.deploy-mode }}'
          DISPATCH_RELEASE_REF: '${{ github.event.inputs.release-ref }}'
          EVENT_NAME: '${{ github.event_name }}'
          EVENT_SHA: '${{ github.sha }}'
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0
          ref: '${{ steps.deployment.outputs.checkout-ref }}'
          persist-credentials: true
      - name: 'Require authoritative main for development docs'
        if: "${{ steps.deployment.outputs.deploy-mode == 'push' }}"
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${DEFAULT_BRANCH}")" ]; then
            echo 'Development docs require the current default-branch head.' >&2
            exit 1
          fi
        env:
          DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
      - name: 'Fetch gh-pages branch'
        run: |
          git fetch origin gh-pages:gh-pages --depth=1
          git config --global user.name "${ACTOR}"
          git config --global user.email "${ACTOR}@users.noreply.github.com"
        env:
          ACTOR: "${{ github.actor }}"
      - name: 'Setup uv with python ${{ matrix.python-version }}'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '${{ matrix.python-version }}'
      - name: 'Classify op_engine version'
        id: classify-version
        run: >-
          uv run python scripts/release_validate.py --scope core
          --github-output "${GITHUB_OUTPUT}"
      - name: 'Build API Reference'
        run: 'just api-reference'
      - name: 'Deploy to GitHub Pages'
        run: |
          set -euo pipefail
          if [ "${DEPLOY_MODE}" = 'release' ]; then
            EXPECTED_TAG="v${PACKAGE_VERSION}"
            if [ "${CHECKOUT_REF}" != "${EXPECTED_TAG}" ]; then
              echo "Release ref must equal ${EXPECTED_TAG}." >&2
              exit 1
            fi
            if ! git tag --points-at HEAD --list "${EXPECTED_TAG}" | grep -Fxq "${EXPECTED_TAG}"; then
              echo "Release documentation must be built from ${EXPECTED_TAG}." >&2
              exit 1
            fi
            if uv run mike list | awk '{print $1}' | grep -Fxq "${PACKAGE_VERSION}"; then
              echo "Documentation version ${PACKAGE_VERSION} already exists; exact versions are immutable." >&2
              exit 1
            fi
          fi
          uv run python scripts/docs_deploy.py \
            --mode "${DEPLOY_MODE}" \
            --version "${PACKAGE_VERSION}" \
            --alias "${PACKAGE_DOCS_ALIAS}"
        env:
          CHECKOUT_REF: '${{ steps.deployment.outputs.checkout-ref }}'
          DEPLOY_MODE: '${{ steps.deployment.outputs.deploy-mode }}'
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          PACKAGE_DOCS_ALIAS: '${{ steps.classify-version.outputs.docs-alias }}'
          PACKAGE_VERSION: '${{ steps.classify-version.outputs.docs-version }}'
