---
name: 'Release'

'on':
  workflow_dispatch:
    inputs:
      publish-target:
        description: 'Package publish target'
        required: true
        default: 'none'
        type: 'choice'
        options:
          - 'none'
          - 'testpypi'
          - 'pypi'
      create-github-release:
        description: 'Create the GitHub release after publishing'
        required: true
        default: false
        type: 'boolean'
      deploy-docs:
        description: 'Deploy versioned docs after creating the GitHub release'
        required: true
        default: false
        type: 'boolean'

permissions:
  contents: 'read'

jobs:
  validate:
    name: 'Validate release'
    runs-on: 'ubuntu-latest'
    outputs:
      version: '${{ steps.validate-version.outputs.version }}'
      release-tag: '${{ steps.validate-version.outputs.release-tag }}'
      docs-version: '${{ steps.validate-version.outputs.docs-version }}'
      docs-alias: '${{ steps.validate-version.outputs.docs-alias }}'
      prerelease: '${{ steps.validate-version.outputs.prerelease }}'
      release-phase: '${{ steps.validate-version.outputs.release-phase }}'
      maturity: '${{ steps.validate-version.outputs.maturity }}'
    steps:
      - name: 'Install just'
        uses: 'taiki-e/install-action@v2'
        with:
          tool: 'just'
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Setup uv with python 3.12'
        uses: 'astral-sh/setup-uv@v7.2.0'
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
          python-version: '3.12'
      - name: 'Require authoritative main for production actions'
        if: >-
          ${{
            inputs.publish-target == 'pypi' ||
            inputs.create-github-release ||
            inputs.deploy-docs
          }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo 'PyPI publication, GitHub releases, and release docs must run from the default branch.' >&2
            exit 1
          fi
          git fetch origin "${DEFAULT_BRANCH}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${DEFAULT_BRANCH}")" ]; then
            echo 'Production actions require the current default-branch head.' >&2
            exit 1
          fi
        env:
          DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
      - name: 'Validate core package version'
        id: validate-version
        run: |
          uv run python scripts/release_validate.py \
            --scope core \
            --github-output "${GITHUB_OUTPUT}"
          just citation
      - name: 'Run release build validation'
        run: 'just build-all-core'
        env:
          UV_PYTHON_VERSION: '3.12'
      - name: 'Build core release artifacts'
        run: |
          rm -rf release-dist
          mkdir -p release-dist/op_engine
          uv run --with build --with twine python -m build --outdir release-dist/op_engine
          uv run --with twine python -m twine check --strict release-dist/op_engine/*
      - name: 'Upload core package artifacts'
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'op-engine-dist'
          path: 'release-dist/op_engine/*'
          if-no-files-found: 'error'

  publish-core:
    name: 'Publish op_engine'
    needs:
      - 'validate'
    runs-on: 'ubuntu-latest'
    permissions:
      id-token: 'write'
    steps:
      - name: 'Skip core publish'
        if: "${{ github.event.inputs.publish-target == 'none' }}"
        run: 'echo "publish-target=none; skipping op_engine publish."'
      - name: 'Download core package artifacts'
        if: "${{ github.event.inputs.publish-target != 'none' }}"
        uses: 'actions/download-artifact@v8'
        with:
          name: 'op-engine-dist'
          path: 'dist'
      - name: 'Publish core package to TestPyPI'
        if: "${{ github.event.inputs.publish-target == 'testpypi' }}"
        uses: 'pypa/gh-action-pypi-publish@release/v1'
        with:
          packages-dir: 'dist'
          repository-url: 'https://test.pypi.org/legacy/'
      - name: 'Publish core package to PyPI'
        if: "${{ github.event.inputs.publish-target == 'pypi' }}"
        uses: 'pypa/gh-action-pypi-publish@release/v1'
        with:
          packages-dir: 'dist'

  create-github-release:
    name: 'Create GitHub release'
    needs:
      - 'validate'
      - 'publish-core'
    if: >-
      ${{
        github.event.inputs.create-github-release == 'true' &&
        needs.validate.result == 'success' &&
        needs.publish-core.result == 'success'
      }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
    steps:
      - name: 'Create release'
        run: |
          ARGS=(
            release create "${RELEASE_TAG}"
            --repo "${GITHUB_REPOSITORY}"
            --target "${GITHUB_SHA}"
            --title "${RELEASE_TAG}"
            --generate-notes
          )
          if [ "${PRERELEASE}" = 'true' ]; then
            ARGS+=(--prerelease)
          fi
          gh "${ARGS[@]}"
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GITHUB_REPOSITORY: '${{ github.repository }}'
          GITHUB_SHA: '${{ github.sha }}'
          PRERELEASE: '${{ needs.validate.outputs.prerelease }}'
          RELEASE_TAG: '${{ needs.validate.outputs.release-tag }}'

  deploy-docs:
    name: 'Deploy release docs'
    needs:
      - 'validate'
      - 'create-github-release'
    if: >-
      ${{
        github.event.inputs.deploy-docs == 'true' &&
        needs.create-github-release.result == 'success'
      }}
    permissions:
      contents: 'write'
    uses: './.github/workflows/gh-pages.yaml'
    with:
      deploy-mode: 'release'
      release-ref: '${{ needs.validate.outputs.release-tag }}'
    secrets: 'inherit'
